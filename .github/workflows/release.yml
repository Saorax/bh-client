name: Release

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "native/**"
      - "bifrost-stubs/**"
      - "tools/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, windows, brawlhalla]
    steps:
      - name: Build and publish Official
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ vars.BIFROST_ENGINE_DIR }}
        run: |
          if (-not $env:ENGINE) { Write-Error "set the BIFROST_ENGINE_DIR variable (Settings > Secrets and variables > Actions > Variables) to the engine branch's folder on the runner's PC"; exit 1 }
          Set-Location $env:ENGINE
          python tools/player_release.py --product official --publish --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
